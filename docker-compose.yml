# The whole lab: one command (docker compose up --build) starts all six containers.
services:
  app:
    build: ./app
    ports: ["8000:8000"]
    restart: "no"            # nothing restarts it automatically except the remediator

  traffic:                   # steady fake customers, so the charts have something to show
    image: curlimages/curl:8.10.1
    command: ["sh", "-c", "while true; do curl -s -o /dev/null http://app:8000/pay; sleep 0.5; done"]
    depends_on: [app]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  remediator:
    build: ./remediator
    env_file: .env
    environment:
      TARGET_SERVICE: app
      HEALTH_URL: http://app:8000/health
    volumes:
      # Lets the remediator restart containers. Powerful: fine for a laptop lab, never in production.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["9000:9000"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/self-healing.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
