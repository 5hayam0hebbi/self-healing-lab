groups:
  - name: self-healing
    rules:
      - alert: AppUnhealthy
        expr: app_healthy == 0
        for: 15s
        labels:
          severity: critical
          remediation: restart
        annotations:
          summary: "payments health check failing (process up, not serving)"
          runbook: "memory-leak-hang"
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 20s
        labels:
          severity: critical
          remediation: restart
        annotations:
          summary: "payments process not answering Prometheus"
          runbook: "memory-leak-hang"
      - alert: HighErrorRate
        expr: sum(rate(app_requests_total{status=~"5.."}[1m])) / sum(rate(app_requests_total[1m])) > 0.2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "more than 20% of payments failing"
